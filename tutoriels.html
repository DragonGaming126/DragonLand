<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fire Streak – Entraînement Quotidien</title>
  <style>
    :root {
      --vert: #4caf50;
      --vert-clair: #81c784;
      --orange: #ff9800;
      --gris: #757575;
      --bg: #121212;
      --card: #1e1e1e;
      --text: #e0e0e0;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    h1, h2 { margin: 0.4em 0; }
    .container { max-width: 420px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .today-circle {
      width: 140px;
      height: 140px;
      background: linear-gradient(145deg, #ff6b6b, #ff8e53);
      border-radius: 50%;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: bold;
      color: white;
      box-shadow: 0 8px 30px rgba(255,107,107,0.4);
    }
    .streak {
      font-size: 2.4rem;
      font-weight: bold;
      text-align: center;
      margin: 12px 0;
    }
    .streak small { font-size: 1rem; opacity: 0.7; }
    .btn {
      background: var(--vert);
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      margin: 12px auto;
      display: block;
      width: 80%;
      max-width: 300px;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--vert-clair); transform: translateY(-2px); }
    .btn-secondary { background: #424242; }
    input[type=number] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      text-align: center;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.9rem;
    }
    .day {
      padding: 10px 0;
      border-radius: 8px;
      background: #2a2a2a;
    }
    .day.done   { background: var(--vert); color: black; font-weight: bold; }
    .day.today  { border: 3px solid var(--orange); }
    .day.empty  { background: transparent; }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      text-align: center;
    }
    .milestone {
      background: linear-gradient(145deg, #673ab7, #9c27b0);
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    header {
      text-align: center;
      padding: 16px 0;
      font-size: 1.4rem;
      font-weight: bold;
      background: linear-gradient(to right, #ff6b6b, #ff8e53);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    nav {
      display: flex;
      justify-content: space-around;
      margin: 16px 0;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 16px;
    }
    nav button {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      padding: 8px 16px;
    }
    nav button.active { color: var(--vert-clair); font-weight: bold; border-bottom: 3px solid var(--vert-clair); }
  </style>
</head>
<body>

<div class="container">

  <header>🔥 Fire Streak</header>

  <nav>
    <button data-screen="today" class="active">Today</button>
    <button data-screen="add">+ Ajouter</button>
    <button data-screen="calendar">Calendrier</button>
    <button data-screen="stats">Stats</button>
  </nav>

  <!-- Écran Today -->
  <div id="today" class="screen card active">
    <div class="today-circle" id="today-date">04</div>
    <div class="streak" id="current-streak">Streak : 0 jours 🔥</div>
    <div style="text-align:center; opacity:0.8;" id="best-streak">Meilleur : 0 jours</div>

    <div id="status" style="text-align:center; margin:20px 0; font-size:1.3rem;">
      Pas encore fait aujourd'hui…
    </div>

    <button class="btn" id="btn-add-today">+ Ajouter l'entraînement du jour</button>
  </div>

  <!-- Écran Ajout -->
  <div id="add" class="screen card">
    <h2>Ajouter l'entraînement du jour</h2>
    <label>Pompes</label>
    <input type="number" id="pompes" min="0" value="0" placeholder="ex: 45">

    <label>Tractions</label>
    <input type="number" id="tractions" min="0" value="0" placeholder="ex: 12">

    <label>Abdos</label>
    <input type="number" id="abdos" min="0" value="0" placeholder="ex: 80">

    <button class="btn" id="btn-save">Valider & Sauvegarder</button>
    <button class="btn btn-secondary" id="btn-cancel">Annuler</button>
  </div>

  <!-- Écran Calendrier -->
  <div id="calendar" class="screen card">
    <h2>Historique</h2>
    <div id="calendar-grid" class="calendar-grid"></div>
  </div>

  <!-- Écran Stats -->
  <div id="stats" class="screen card">
    <h2>Statistiques globales</h2>
    <div class="stats-grid">
      <div>
        <div style="font-size:2.2rem; font-weight:bold;" id="total-pompes">0</div>
        <div>Pompes</div>
      </div>
      <div>
        <div style="font-size:2.2rem; font-weight:bold;" id="total-tractions">0</div>
        <div>Tractions</div>
      </div>
      <div>
        <div style="font-size:2.2rem; font-weight:bold;" id="total-abdos">0</div>
        <div>Abdos</div>
      </div>
      <div>
        <div style="font-size:2.2rem; font-weight:bold;" id="total-reps">0</div>
        <div>Total reps</div>
      </div>
    </div>

    <div style="margin:24px 0; text-align:center;">
      <div class="milestone" id="level">Niveau : Débutant</div>
    </div>
  </div>

</div>

<script>
  // ──────────────────────────────────────────────
  // Gestion des écrans
  // ──────────────────────────────────────────────
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(btn.dataset.screen).classList.add('active');
    });
  });

  // ──────────────────────────────────────────────
  // Stockage local
  // ──────────────────────────────────────────────
  const STORAGE_KEY = 'fireStreakData';
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    workouts: {},
    totalPompes: 0,
    totalTractions: 0,
    totalAbdos: 0,
    bestStreak: 0
  };

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getToday() {
    return new Date().toISOString().split('T')[0];
  }

  function isDone(date) {
    const w = data.workouts[date];
    return w && (w.pompes + w.tractions + w.abdos > 0);
  }

  function calculateStreak() {
    let streak = 0;
    let date = new Date();
    while (true) {
      const d = date.toISOString().split('T')[0];
      if (isDone(d)) {
        streak++;
        date.setDate(date.getDate() - 1);
      } else {
        break;
      }
    }
    data.currentStreak = streak;
    if (streak > data.bestStreak) data.bestStreak = streak;
    save();
  }

  function updateTodayScreen() {
    const today = getToday();
    calculateStreak();

    document.getElementById('today-date').textContent = new Date().getDate();
    document.getElementById('current-streak').innerHTML = `Streak : ${data.currentStreak || 0} jours <small>🔥</small>`;
    document.getElementById('best-streak').textContent = `Meilleur : ${data.bestStreak} jours`;

    if (isDone(today)) {
      document.getElementById('status').innerHTML = '<span style="color:#81c784; font-weight:bold;">✓ Tu tiens le feu !</span>';
      document.getElementById('btn-add-today').style.display = 'none';
    } else {
      document.getElementById('status').textContent = 'Pas encore fait aujourd’hui…';
      document.getElementById('btn-add-today').style.display = 'block';
    }
  }

  function updateStats() {
    document.getElementById('total-pompes').textContent = data.totalPompes;
    document.getElementById('total-tractions').textContent = data.totalTractions;
    document.getElementById('total-abdos').textContent = data.totalAbdos;
    const total = data.totalPompes + data.totalTractions + data.totalAbdos;
    document.getElementById('total-reps').textContent = total;

    let level = 'Débutant';
    if (total >= 10000) level = 'Or 🔥🔥🔥';
    else if (total >= 5000) level = 'Argent 🔥🔥';
    else if (total >= 1000) level = 'Bronze 🔥';
    document.getElementById('level').textContent = `Niveau : ${level}`;
  }

  function generateCalendar() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startWeekday = firstDay.getDay() || 7; // lundi = 1

    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    // En-têtes jours
    ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d => {
      const el = document.createElement('div');
      el.textContent = d;
      el.style.fontWeight = 'bold';
      el.style.opacity = 0.6;
      grid.appendChild(el);
    });

    // Jours vides avant le 1er
    for (let i = 1; i < startWeekday; i++) {
      const el = document.createElement('div');
      el.className = 'day empty';
      grid.appendChild(el);
    }

    // Jours du mois
    for (let d = 1; d <= lastDay.getDate(); d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const el = document.createElement('div');
      el.className = 'day';
      el.textContent = d;

      if (dateStr === getToday()) el.classList.add('today');
      if (isDone(dateStr)) el.classList.add('done');

      grid.appendChild(el);
    }
  }

  // ──────────────────────────────────────────────
  // Événements
  // ──────────────────────────────────────────────
  document.getElementById('btn-add-today').addEventListener('click', () => {
    document.querySelector('nav button[data-screen="add"]').click();
  });

  document.getElementById('btn-cancel').addEventListener('click', () => {
    document.querySelector('nav button[data-screen="today"]').click();
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    const today = getToday();
    const pompes    = parseInt(document.getElementById('pompes').value)    || 0;
    const tractions = parseInt(document.getElementById('tractions').value) || 0;
    const abdos     = parseInt(document.getElementById('abdos').value)     || 0;

    const total = pompes + tractions + abdos;
    if (total === 0) {
      if (!confirm("Enregistrer la journée avec 0 répétition ?")) return;
    }

    data.workouts[today] = { pompes, tractions, abdos };
    data.totalPompes    += pompes;
    data.totalTractions += tractions;
    data.totalAbdos     += abdos;

    save();
    updateTodayScreen();
    updateStats();
    generateCalendar();

    alert("Entraînement enregistré ! 💪");
    document.querySelector('nav button[data-screen="today"]').click();
  });

  // Initialisation
  updateTodayScreen();
  updateStats();
  generateCalendar();
</script>
</body>
</html>
