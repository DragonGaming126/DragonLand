<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fire Streak – Ton Feu Quotidien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <header>🔥 Fire Streak</header>

  <!-- TODAY -->
  <div id="today" class="screen active">
    <div class="today-circle" id="streak-circle">0</div>
    <div class="streak" id="current-streak">0 jours</div>
    <div id="best-streak" class="best">Meilleur : 0 jours</div>
    <div id="status">Pas encore fait aujourd’hui… 🔥</div>
    <button class="btn" id="btn-add-today">+ Ajouter entraînement</button>
  </div>

  <!-- ADD -->
  <div id="add" class="screen">
    <h2>Ajouter entraînement</h2>
    <div id="exercise-list"></div>
    <button id="add-exercise-btn">+ Ajouter un exercice</button>
    <button class="btn" id="btn-save">Valider 💪</button>
    <button class="btn btn-secondary" id="btn-cancel">Annuler</button>
  </div>

  <!-- CALENDAR -->
  <div id="calendar" class="screen">
    <h2>Historique</h2>
    <div class="calendar-nav">
      <button id="prev-month">←</button>
      <div id="month-title"></div>
      <button id="next-month">→</button>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
  </div>

  <!-- STATS -->
  <div id="stats" class="screen">
    <h2>Statistiques globales</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="total-pompes">0</div>
        <div class="stat-label">Pompes</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-tractions">0</div>
        <div class="stat-label">Tractions</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-abdos">0</div>
        <div class="stat-label">Abdos / Core</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-reps">0</div>
        <div class="stat-label">Total reps</div>
      </div>
    </div>
    <div class="challenge-card" id="challenge-section" style="display:none;">
      <h3>Challenge : 100 pompes / jour</h3>
      <div id="challenge-bar-container"><div id="challenge-bar"></div></div>
      <div id="challenge-status">0 / 30 jours</div>
    </div>
    <div id="level" class="milestone">Niveau : Débutant</div>
  </div>
</div>

<!-- Modal détails jour -->
<div id="day-detail-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <span class="close" id="modal-close">×</span>
    <h3 id="modal-date"></h3>
    <div class="modal-stats" id="modal-stats"></div>
    <div class="modal-total" id="modal-total"></div>
  </div>
</div>

<!-- Sélecteur exercices (version améliorée avec tags + recherche) -->
<div id="exercise-selector" class="exercise-selector-modal">
  <div class="selector-container">
    <div class="selector-header">
      <h3>Choisir un exercice</h3>
      <input id="ex-search" type="text" placeholder="Rechercher (ex: pompes, core, triceps)">
    </div>
    <div class="tag-filters">
      <button class="tag-filter active" data-tag="all">Tous</button>
      <button class="tag-filter" data-tag="pompes">Pompes</button>
      <button class="tag-filter" data-tag="tractions">Tractions</button>
      <button class="tag-filter" data-tag="core">Core</button>
      <button class="tag-filter" data-tag="jambes">Jambes</button>
      <button class="tag-filter" data-tag="push">Push</button>
      <button class="tag-filter" data-tag="pull">Pull</button>
      <button class="tag-filter" data-tag="cardio">Cardio</button>
    </div>
    <div id="ex-list" class="ex-list"></div>
    <button id="close-selector" class="btn btn-secondary">Annuler</button>
  </div>
</div>

<nav>
  <button data-screen="today" class="active"><span>🏠</span>Today</button>
  <button data-screen="add"><span>+</span>Ajouter</button>
  <button data-screen="calendar"><span>📅</span>Calendrier</button>
  <button data-screen="stats"><span>📊</span>Stats</button>
</nav>

<script src="script.js"></script>
</body>
</html>
