            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;

            .choice-button.action {

                }

            .choice-button.verite {

                color: #fff;
            }

                .choice-button.verite:hover {

                }

        .question-container {
            margin-top: 1em;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd700;
            border-radius: 5px;
            padding: 1em;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        let history = [];
        let usedQuestions = {}; // Suivi des questions utilisées par thème
        let usedActions = {};  // Suivi des actions utilisées par thème

        function loadQuestion() {
            const theme = document.getElementById('themeSelect').value;
            if (!usedQuestions[theme]) usedQuestions[theme] = new Set();
            if (!usedActions[theme]) usedActions[theme] = new Set();
            document.getElementById('questionContainer').innerHTML = 'Choisis une option pour commencer...';
        }

        function chooseOption(type) {
            const theme = document.getElementById('themeSelect').value;
            const questionList = questions[theme].questions;
            const actionList = questions[theme].actions;
            let availableQuestions = questionList.filter(q => !usedQuestions[theme].has(q));
            let availableActions = actionList.filter(a => !usedActions[theme].has(a));

            if (availableQuestions.length === 0 && availableActions.length === 0) {
                const questionContainer = document.getElementById('questionContainer');
                questionContainer.innerHTML = `<div class="no-proposal">Plus aucune proposition</div>`;
                setTimeout(() => {
                    usedQuestions[theme].clear();
                    usedActions[theme].clear();
                    chooseOption(type); // Recharger après réinitialisation
                }, 2000);
                return;
            }

            let content;
            if (type === 'action') {
                if (availableActions.length === 0) {
                    usedActions[theme].clear(); // Réinitialiser actions si vides
                    availableActions = actionList;
                }
                const randomIndex = Math.floor(Math.random() * availableActions.length);
                content = availableActions[randomIndex];
                usedActions[theme].add(content);
            } else { // verite
                if (availableQuestions.length === 0) {
                    usedQuestions[theme].clear(); // Réinitialiser questions si vides
                    availableQuestions = questionList;
                }
                const randomIndex = Math.floor(Math.random() * availableQuestions.length);
                content = availableQuestions[randomIndex];
                usedQuestions[theme].add(content);
            }

            document.getElementById('questionContainer').innerHTML = content;
            const displayType = type === 'action' ? '<span style="color: #ff4444;" >Action</span>' : '<span style="color: #00cc00;">Vérité</span>';
            const displayTheme =
                theme === 'general'
                    ? '<span style="color: #ffd700; font-weight: bold;">Général</span>'
              : theme === 'hot'
                    ? '<span style="color: #ff4500; font-weight: bold;">Hot</span>'
              : theme === 'extreme'
                    ? '<span style="color: #8A2BE2; font-weight: bold;">Extrême</span>'
              : theme === 'gachas'
                    ? '<span style="color: #1e90ff; font-weight: bold;">Gachas</span>'
              : '';
            history.unshift(`${displayTheme} : ${displayType} : ${content} (${new Date().toLocaleTimeString()})`);
            document.getElementById('historyList').innerHTML = history.map(item => `<li>${item}</li>`).join('');
        }
